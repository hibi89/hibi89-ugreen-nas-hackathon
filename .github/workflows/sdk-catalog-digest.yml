name: Pinned official Uliya CLI catalog identifier digest
on:
  push:
    branches: ["lead/ugreen"]
    paths:
      - "tools/sdk_catalog_digest.py"
      - ".github/workflows/sdk-catalog-digest.yml"
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    env:
      KIT_URL: https://cdn.shopify.com/s/files/1/0630/9416/1602/files/uliya-skill-kit-0.7.3-en.zip?v=1790578898
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse official public capability catalog in memory — never execute SDK
        run: python tools/sdk_catalog_digest.py --official-url "$KIT_URL"
