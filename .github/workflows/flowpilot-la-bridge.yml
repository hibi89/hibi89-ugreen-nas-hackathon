name: UGREEN LA bridge isolated integration checks

on:
  push:
    branches:
      - feature/flowpilot-ecosystem-integration
    paths:
      - "integrations/**"
      - "tests/test_la_bridge.py"
      - "tests/test_sovia_bridge.py"
      - "tests/test_flowpilot_la_sovia_pipeline.py"
      - "tests/test_flowpilot_la_coordinator.py"
      - "tests/test_ecosystem_contract.py"
      - "tests/test_approval_scope.py"
      - "tests/test_verify_la_runtime_bridge.py"
      - "tests/test_verify_private_hae_chain.py"
      - "tests/test_local_proof_receipt.py"
      - "tools/verify_local_proof_receipt.py"
      - "tools/verify_private_hae_chain.py"
      - "tests/test_flowpilot_ecosystem_showcase.py"
      - "tools/flowpilot_ecosystem_showcase.py"
      - "tools/verify_la_runtime_bridge.py"
      - ".github/workflows/flowpilot-la-bridge.yml"
  workflow_dispatch:

# Keep only the newest integration check for this feature branch.
concurrency:
  group: flowpilot-la-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  la-bridge-contract:
    name: Offline adapter contracts (NO NAS, NO PRIVATE HAE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify UGREEN integration contract
        run: python -m unittest discover -s tests -p 'test_ecosystem_contract.py' -v
      - name: Verify exact FlowPilot owner approval scope (offline)
        run: python -m unittest discover -s tests -p 'test_approval_scope.py' -v
      - name: Verify local SQLite runtime proof harness with synthetic fake LA
        run: python -m unittest discover -s tests -p 'test_verify_la_runtime_bridge.py' -v
      - name: Verify owner-private HAE git SHA and dirty-worktree refusal
        run: python -m unittest discover -s tests -p 'test_verify_private_hae_chain.py' -v
      - name: Classify owner-reported real LA plus SOVIA synthetic proof (not replay)
        run: |
          python -m unittest discover -s tests -p 'test_local_proof_receipt.py' -v
          python tools/verify_local_proof_receipt.py > /tmp/ugreen-owner-reported-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/ugreen-owner-reported-proof.json').read_text())
          assert r['result'] == 'ACCEPTED_OWNER_REPORTED_SYNTHETIC_PROOF'
          assert r['independently_replayed_in_ugreen_ci'] is False
          assert r['reported_actual_la_sqlite'] == 'PASS'
          assert r['reported_actual_sovia_advisory'] == 'PASS'
          assert r['actual_nas_verified'] is False
          assert r['registered_uliya_expert_invoked'] is False
          assert r['release_gate'] == 'HOLD'
          print('PASS: owner report classified without misrepresenting HAE execution or NAS status')
          PY
      - name: Verify LA read-only adapter contract
        run: python -m unittest discover -s tests -p 'test_la_bridge.py' -v
      - name: Verify real FlowPilot goal preview to injected LA preflight composition
        run: python -m unittest discover -s tests -p 'test_flowpilot_la_coordinator.py' -v
      - name: Verify UGREEN SOVIA adapter contract
        run: python -m unittest discover -s tests -p 'test_sovia_bridge.py' -v
      - name: Verify one-pass FlowPilot, LA, and SOVIA integration contract
        run: python -m unittest discover -s tests -p 'test_flowpilot_la_sovia_pipeline.py' -v
      - name: Test four bounded synthetic showcase states
        run: python -m unittest discover -s tests -p 'test_flowpilot_ecosystem_showcase.py' -v
      - name: Checkout pinned public SOVIA source for synthetic cross-repo contract test
        uses: actions/checkout@v4
        with:
          repository: hibi89/SOVIA_sovereign
          ref: 7418b23aff9b3abbd3faf5d1477e7244ec82b681
          path: sovia-public
          persist-credentials: false
      - name: Verify actual SOVIA sanitized LA plan assessor (public source, no NAS)
        run: |
          PYTHONPATH=sovia-public python - <<'PY'
          from sovia_la_plan_preflight import assess
          plan = {
              "schema_version": "sovia.plan_review.v1",
              "plan_ref": "ugreen_synthetic",
              "steps": [{"step_id": "sample_1", "tool_code": "la_sqlite_put",
                         "side_effect": "local_write", "permission_asserted": False}]
          }
          policy = {"schema_version": "1.0", "policy": {
              "allowed_tools": ["la_sqlite_put"], "approved_destinations": [],
              "sensitive_targets": []
          }}
          result = assess(plan, policy)
          assert result["finding_count"] == 1
          assert result["execution_authorized"] is False
          assert result["real_la_integration_verified"] is False
          assert result["offline_only"] is True
          from integrations.sovia_bridge import assess_la_preview
          request = {"intent": "CHECK_REQUIRED", "folder": "/synthetic-preview",
                     "required_paths": ["README.md"], "owner_approved_metadata": True,
                     "runtime_permissions_verified": True, "processing_location_accepted": True}
          preview = {"source_version": "azent.ir.v0", "scope": "synthetic-local-only",
                     "executes_workflow": False, "step_count": 1,
                     "requires_write_approval": True,
                     "steps": [{"id": "redacted_owner_step_id", "op": "sqlite_put"}]}
          bridged = assess_la_preview(request, preview, policy, assess)
          assert bridged["state"] == "ADVISORY_ONLY"
          assert bridged["finding_count"] == 1
          assert bridged["execution_authorized"] is False
          assert bridged["nas_state"] == "NOT_CHECKED"
          print("PASS: UGREEN sanitized adapter -> real SOVIA assessor with synthetic metadata")
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from flowpilot_goal_preview import process_goal
          from integrations.flowpilot_la_coordinator import compose_previews
          class LocalLA:
              @staticmethod
              def preflight(plan):
                  return {"source_version": "azent.ir.v0", "trigger_type": "manual",
                          "step_count": 1, "requires_write_approval": True,
                          "requires_input_root": False,
                          "executes_workflow": False, "scope": "synthetic-local-only",
                          "steps": [{"id": "synthetic_local_step", "op": "sqlite_put"}]}
          three = compose_previews(
              "필수 파일 확인", root=Path("/synthetic-preview"), required=["README.md"],
              candidates=None, la_plan={"version": "azent.ir.v0", "steps": []},
              owner_request=request, flowpilot_preview=process_goal, la_api=LocalLA,
              sovia_assess=assess, sovia_policy=policy,
          )
          assert three["status"] == "WAITING_APPROVAL"
          assert three["la"]["sovia"]["finding_count"] == 1
          assert three["la"]["sovia"]["execution_authorized"] is False
          assert three["la_workflow_executed"] is False
          assert three["owner_folder_metadata_accessed"] is False
          assert three["nas_state"] == "NOT_CHECKED"
          print("PASS: actual UGREEN goal planner -> injected LA -> real SOVIA source")
          print("PASS: actual SOVIA source reviewed synthetic LA-shaped metadata; LA/NAS NOT_RUN")
          PY
      - name: Run synthetic reviewer demo with actual pinned SOVIA assessor
        run: |
          python tools/flowpilot_ecosystem_showcase.py --sovia-root sovia-public --scenario write_review > /tmp/ugreen-write.json
          python tools/flowpilot_ecosystem_showcase.py --sovia-root sovia-public --scenario read_only > /tmp/ugreen-read.json
          python tools/flowpilot_ecosystem_showcase.py --sovia-root sovia-public --scenario missing_input > /tmp/ugreen-missing.json
          python tools/flowpilot_ecosystem_showcase.py --sovia-root sovia-public --scenario declined > /tmp/ugreen-declined.json
          python - <<'PY'
          import json
          from pathlib import Path
          results = {name: json.loads(Path('/tmp/ugreen-'+name+'.json').read_text()) for name in ('write','read','missing','declined')}
          assert results['write']['advisory_finding_count'] == 1
          assert results['write']['sovia'] == 'ADVISORY_ONLY'
          assert results['read']['advisory_finding_count'] == 0
          assert results['missing']['flowpilot'] == 'WAITING_USER'
          assert results['missing']['la'] == 'NOT_CHECKED'
          assert results['declined']['la'] == 'NOT_CHECKED'
          assert all(row['release_gate'] == 'HOLD' and row['actual_nas_verified'] is False and row['la_workflow_executed'] is False for row in results.values())
          print('SHOWCASE 4/4 PASS: real FlowPilot planner + simulated LA preflight + pinned SOVIA assessor; NAS NOT_TESTED')
          PY
      - name: Build hash-labeled, synthetic-only reviewer evidence
        env:
          REVIEWED_UGREEN_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p demo-evidence
          cp /tmp/ugreen-write.json demo-evidence/write_review.json
          cp /tmp/ugreen-read.json demo-evidence/read_only.json
          cp /tmp/ugreen-missing.json demo-evidence/missing_input.json
          cp /tmp/ugreen-declined.json demo-evidence/declined.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('demo-evidence')
          files = sorted(root.glob('*.json'))
          assert len(files) == 4
          reports = {}
          for path in files:
              raw = path.read_bytes()
              record = json.loads(raw)
              assert record['mode'] == 'SYNTHETIC_PLAN_PREVIEW_AND_ADVISORY_ONLY'
              assert record['actual_nas_verified'] is False
              assert record['la_workflow_executed'] is False
              assert record['release_gate'] == 'HOLD'
              assert record['la_preflight_source'] == 'SIMULATED_LA_PREFLIGHT'
              reports[path.name] = {'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)}
          manifest = {
              'schema': 'ugreen-ecosystem-demo-evidence.v1',
              'ugreen_commit': os.environ['REVIEWED_UGREEN_COMMIT'],
              'sovia_source_commit': '7418b23aff9b3abbd3faf5d1477e7244ec82b681',
              'flowpilot': 'REAL_BOUNDED_LOCAL_GOAL_PREVIEW',
              'lightning_azent': 'SIMULATED_PREFLIGHT_NOT_REAL_HAE',
              'sovia': 'PINNED_PUBLIC_SOURCE_ACTUAL_ASSESSOR',
              'nas_and_uliya': 'NOT_TESTED',
              'customer_data': 'NOT_USED',
              'release_gate': 'HOLD',
              'reports': reports,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + '\\n', encoding='utf-8'
          )
          print('PASS: 4 redacted synthetic reviewer reports and SHA-256 manifest')
          PY
      - name: Publish CI evidence artifact (synthetic only)
        uses: actions/upload-artifact@v4
        with:
          name: ugreen-ecosystem-synthetic-${{ github.sha }}
          path: demo-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Syntax-check adapter and opt-in LA runtime verifier
        run: python -m py_compile integrations/ecosystem_contract.py integrations/approval_scope.py integrations/la_bridge.py integrations/flowpilot_la_coordinator.py integrations/sovia_bridge.py tools/verify_la_runtime_bridge.py tools/flowpilot_ecosystem_showcase.py tools/verify_private_hae_chain.py tools/verify_local_proof_receipt.py integrations/local_proof_receipt.py
      - name: Check no source secrets or private runtime assumptions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("integrations/la_bridge.py")
          code = p.read_text(encoding="utf-8")
          assert "from lightning_azent" not in code
          assert "import lightning_azent" not in code
          assert "executes_workflow" in code
          print("PASS: external LA source not bundled; local synthetic contract only")
          print("ACTUAL HAE/LA RUNTIME: NOT RUN")
          print("REAL NAS/ULIYA EXPERTS: NOT RUN")
          PY
