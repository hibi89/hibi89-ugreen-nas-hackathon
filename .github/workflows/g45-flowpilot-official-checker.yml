name: G45 first-party Uliya checker in network-isolated container
on:
  push:
    branches: ["lead/ugreen"]
    paths:
      - ".github/workflows/g45-flowpilot-official-checker.yml"
      - "skill/flowpilot-nas/SKILL.md"
      - "tests/test_flowpilot_g47_security.py"
      - "tests/test_flowpilot_demo.py"
      - "tools/flowpilot_offline_demo.py"
      - "tests/test_flowpilot_mvp.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-static-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bound candidate SHA from checkout and run G45 safety regressions
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=skill/flowpilot-nas/SKILL.md
          test -f "$SOURCE"
          echo "985713d709aa36ad3e590557aac242be860716834f31eb27ff460bee960184b0  $SOURCE" | sha256sum --check
          HASH=$(sha256sum "$SOURCE" | cut -d' ' -f1)
          echo "G45_SKILL_SHA256=$HASH" >> "$GITHUB_ENV"
          echo "G45 CHECKOUT exact candidate SHA256=$HASH"
          python3 - <<'PY'
          import unittest
          loader=unittest.TestLoader()
          suite=unittest.TestSuite((
              loader.discover("tests", pattern="test_flowpilot_mvp.py"),
              loader.discover("tests", pattern="test_flowpilot_evidence.py"),
              loader.discover("tests", pattern="test_flowpilot_g47_security.py"),
              loader.discover("tests", pattern="test_flowpilot_demo.py"),
          ))
          count=suite.countTestCases()
          if count < 50:
              raise SystemExit("G46: expected at least 50 discovered tests; got "+str(count))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit("FlowPilot unit test gate failed")
          print("G46 OFFLINE FLOWPILOT",count,"/ ",count,"PASS; NOT NAS")
          PY
      - name: Download authenticated-public vendor URL, verify pinned vendor archive, safely extract in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g45-private"
          curl --fail --silent --show-error --location --max-time 90 --retry 1             'https://cdn.shopify.com/s/files/1/0630/9416/1602/files/uliya-skill-kit-0.7.3-en.zip?v=1790578898'             --output "$RUNNER_TEMP/g45-private/vendor.zip"
          echo "cf557e5a022e4297892f39768132855154232efdedeb726b2845450ccd70e1b3  $RUNNER_TEMP/g45-private/vendor.zip" | sha256sum --check
          python - <<'PY'
          import os, pathlib, zipfile, stat
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"g45-private"
          z=zipfile.ZipFile(p/"vendor.zip")
          entries=z.infolist()
          assert len(entries)<=1000 and len(entries)>2
          assert sum(e.file_size for e in entries)<64*1024*1024
          seen=set()
          for e in entries:
              s=e.filename
              assert s and not s.startswith("/") and "\\" not in s and ":" not in s
              parts=s.rstrip("/").split("/")
              assert all(x not in ("", ".", "..") for x in parts)
              key=s.rstrip("/").casefold()
              assert key not in seen
              seen.add(key)
              assert e.file_size<=8*1024*1024
              assert not stat.S_ISLNK((e.external_attr >>16)&0xffff)
          target=p/"extract"
          target.mkdir()
          z.extractall(target)
          scripts=list(target.rglob("scripts/check-skill.mjs"))
          assert len(scripts)==1
          kit=scripts[0].parent.parent
          assert (kit/"SKILL.md").is_file()
          assert (kit/"data/capability-catalog.json").is_file()
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("G45_KIT_ROOT="+str(kit)+"\n")
          print("VENDOR_PINNED_ARCHIVE_SAFE_EXTRACTED_EPHEMERALLY")
          PY
      - name: Execute first-party checker once with network denied and filesystem read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g45-evidence
          TARGET="$GITHUB_WORKSPACE/skill/flowpilot-nas"
          # Docker fetches its image before checking; vendor code itself runs --network none.
          docker pull node:22-alpine >/dev/null
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges             --pids-limit 96 --memory 384m --cpus 1 --user 65534:65534             -v "$G45_KIT_ROOT:/vendor:ro"             -v "$TARGET:/candidate/flowpilot-nas:ro"             --workdir /candidate             node:22-alpine node /vendor/scripts/check-skill.mjs /candidate/flowpilot-nas             >g45-evidence/vendor-stdout.private 2>g45-evidence/vendor-stderr.private
          CODE=$?
          set -e
          printf '%s\n' "$CODE" > g45-evidence/exit-code.private
          printf '%s  %s\n' "$G45_SKILL_SHA256" "$TARGET/SKILL.md" | sha256sum --check
          python - <<'PY'
          import hashlib,json,pathlib,os
          d=pathlib.Path("g45-evidence")
          stdout=(d/"vendor-stdout.private").read_text(encoding="utf-8",errors="replace")
          stderr=(d/"vendor-stderr.private").read_text(encoding="utf-8",errors="replace")
          code=int((d/"exit-code.private").read_text().strip())
          obj=None
          try:
              obj=json.loads(stdout.strip())
          except json.JSONDecodeError:
              # Not accepting a passing result from non-JSON or mixed output.
              pass
          def diags(o):
              out=[]
              for x in (o if isinstance(o,list) else [])[:25]:
                  if not isinstance(x,dict):continue
                  out.append({k:x.get(k) for k in ("code","severity","file","line") if k in x})
              return out
          target=pathlib.Path("skill/flowpilot-nas/SKILL.md")
          body=target.read_bytes()
          state=obj.get("status") if isinstance(obj,dict) else "NO_MACHINE_READABLE_RESULT"
          report={
            "evidence_type":"FIRST_PARTY_CHECKER_RUN_ISOLATED_NO_NETWORK",
            "candidate":"flowpilot-nas/SKILL.md",
            "skill_sha256_before_after":os.environ["G45_SKILL_SHA256"],
            "bytes":len(body),"vendor_archive_sha256":"cf557e5a022e4297892f39768132855154232efdedeb726b2845450ccd70e1b3",
            "checker_exit_code":code,"checker_result_status":state,
            "checker_json_sha256":hashlib.sha256(stdout.encode()).hexdigest() if obj is not None else None,
            "checker_summary":{k:obj.get("summary",{}).get(k) for k in ("errors","warnings","info")} if isinstance(obj,dict) else None,
            "diagnostics_codes":diags(obj.get("diagnostics",[])) if isinstance(obj,dict) else [],
            "stderr_present":bool(stderr.strip()),
            "stderr_sha256":hashlib.sha256(stderr.encode()).hexdigest() if stderr.strip() else None,
            "first_party_checker_executed":True,
            "real_nas_or_expert_agent_executed":False,
            "unapproved_external_network_access":False,
            "devpost_submitted":False
          }
          (d/"G45_SANITIZED_CHECKER_RESULT.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          for n in ("vendor-stdout.private","vendor-stderr.private","exit-code.private"):
              (d/n).unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G45-OFFICIAL-STATIC-CHECKER-SANITIZED-RESULT
          path: g45-evidence/G45_SANITIZED_CHECKER_RESULT.json
          retention-days: 7
      - name: Check official verdict (no false green)
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open("g45-evidence/G45_SANITIZED_CHECKER_RESULT.json",encoding="utf-8"))
          assert r["checker_exit_code"]==0, "Official checker non-zero exit"
          assert r["checker_result_status"]=="static-pass", "Official checker did not report static-pass"
          assert r["checker_summary"]=={"errors":0,"warnings":0,"info":0}, "Diagnostics not clean"
          assert not r["diagnostics_codes"] and not r["stderr_present"], "Unverified checker diagnostics"
          print("EXACT_G45_FIRST_PARTY_STATIC_PASS; REAL_NAS_NOT_RUN")
          PY
      - name: Remove downloaded vendor kit; never upload or commit vendor scripts
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/g45-private"
          echo "EPHEMERAL_SDK_REMOVED"
