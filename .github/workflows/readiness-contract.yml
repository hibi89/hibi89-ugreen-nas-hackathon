name: Offline readiness contract
on:
  push:
    branches: ["lead/ugreen"]
    paths:
      - "src/projectready/**"
      - "tests/test_*.py"
      - "tools/round1_package_audit.py"
      - "skill/projectready-nas/**"
      - "docs/roles/lead/DAILY_PROGRESS.json"
      - "docs/roles/lead/LIVE_STATE.json"
      - "docs/roles/lead/LIVE_HANDOFF.md"
      - "docs/roles/lead/SESSION_CLOSEOUT.md"
      - "START_HERE.md"
      - "CHAT_BOOTSTRAP.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/readiness-contract.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute synthetic offline tests only
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Offline preflight against actual Skill folder (NOT official validator)
        run: python tools/round1_package_audit.py --skill-dir skill/projectready-nas
