name: FlowPilot Universal private unsigned Windows EXE candidate
on:
  push:
    branches: ["product/flowpilot-universal"]
    paths:
      - "products/flowpilot_universal/desktop_entry.py"
      - "products/flowpilot_universal/flowpilot_universal/pdf_report.py"
      - "products/flowpilot_universal/flowpilot_universal/session.py"
      - "products/flowpilot_universal/flowpilot_universal/gui.py"
      - "products/flowpilot_universal/flowpilot_universal/manifest_editor.py"
      - "products/flowpilot_universal/verify_delivery_archive.py"
      - ".github/workflows/flowpilot-universal-exe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/flowpilot_universal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PyInstaller dependency (build only, no sale or upload)
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: "pyinstaller==6.22.3" "reportlab==4.4.9"
      - name: Build unsigned local Windows GUI folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-all reportlab --name FlowPilotUniversal desktop_entry.py
      - name: Run bundled EXE with live Tk and synthetic source on runner
        run: |
          python -c "import subprocess,sys,pathlib; exe=pathlib.Path('dist/FlowPilotUniversal/FlowPilotUniversal.exe'); assert exe.is_file(); result=subprocess.run([str(exe.resolve()),'--self-test'],timeout=90,check=False); print('EXE_EXIT',result.returncode); sys.exit(result.returncode)"
      - name: Package complete onedir folder and verify SHA index (CI-only)
        run: |
          python verify_delivery_archive.py --build dist/FlowPilotUniversal dist/flowpilot-internal-candidate.zip
          python verify_delivery_archive.py --verify dist/flowpilot-internal-candidate.zip
          python verify_delivery_archive.py --extract dist/flowpilot-internal-candidate.zip dist/relocated
      - name: Run relocated EXE with developer Python removed from PATH
        run: |
          python -c "import subprocess,sys,pathlib,os; exe=pathlib.Path('dist/relocated/FlowPilotUniversal/FlowPilotUniversal.exe').resolve(); assert exe.is_file(); env=os.environ.copy(); env.pop('PYTHONPATH',None); env.pop('PYTHONHOME',None); win=env.get('SystemRoot','C:\Windows'); env['PATH']=win+'\System32;'+win; result=subprocess.run([str(exe),'--self-test'],env=env,timeout=90,check=False); print('RELOCATED_EXE_EXIT',result.returncode); sys.exit(result.returncode)"
      - name: Report candidate and EXE SHA256 without publication
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 -Path "dist/FlowPilotUniversal/FlowPilotUniversal.exe" | Format-List
          Get-FileHash -Algorithm SHA256 -Path "dist/flowpilot-internal-candidate.zip" | Format-List
          Write-Host "UNSIGNED / LOCAL CI ONLY / NOT A CUSTOMER RELEASE"
