name: G233 real disconnected Docker fixture (NO NAS)
on:
  push:
    branches: [lead/ugreen]
    paths:
      - tools/flowpilot_g233_real_docker_smoke.py
      - .github/workflows/g233-local-docker-smoke.yml
      - tools/flowpilot_g235_typed_dag_docker.py
      - tests/test_flowpilot_g235_typed_dag_docker.py
      - tools/flowpilot_g237_bounded_docker_repair.py
      - tests/test_flowpilot_g237_bounded_docker_repair.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test real Docker sandbox without network, pulls, mounts or NAS
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/flowpilot_g233_real_docker_smoke.py --approve-disconnected-synthetic-docker
      - name: G235 real trusted fixed typed DAG (synthetic only, NO NAS)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/flowpilot_g235_typed_dag_docker.py --approve-synthetic-typed-docker
      - name: G237 actual failed Docker typed DAG, bounded synthetic repair and retest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/flowpilot_g237_bounded_docker_repair.py --approve-synthetic-only-auto-repair
