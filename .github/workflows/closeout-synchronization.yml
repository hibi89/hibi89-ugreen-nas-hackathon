name: Enforce live UGREEN closeout on feature pushes
on:
  push:
    branches: ["lead/ugreen"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every source/test push includes current handoff records
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          python tools/check_handoff_sync.py --base "$BASE_SHA" --head "$HEAD_SHA"
