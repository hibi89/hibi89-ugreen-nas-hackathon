name: UGREEN FlowPilot functional regression (LOCAL ONLY, NOT NAS)
on:
  push:
    branches: ["lead/ugreen"]
    paths:
      - "src/flowpilot/**"
      - "skill/flowpilot-nas/**"
      - "tools/flowpilot_*"
      - "tools/flowpilot3_official_checker.py"
      - "tools/verify_hae_la_local_e2e.py"
      - "tools/g5*"
      - "tools/check_handoff_sync.py"
      - "tests/test_*.py"
      - "verify_local.ps1"
      - ".github/workflows/flowpilot-mvp.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: G69 focused guided goal-to-approved-local-execution E2E
        run: python -m unittest discover -s tests -p 'test_flowpilot_guided_cli.py' -v
      - name: Full single-pass offline regressions (includes all prior security contracts)
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover("tests",pattern="test_*.py")
          count=suite.countTestCases()
          assert count>=505, f"Offline suite unexpectedly small ({count})"
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          assert result.wasSuccessful(), f"Offline regressions failed ({count})"
          skipped=len(result.skipped)
          passed=result.testsRun-skipped
          print(f"UGREEN OFFLINE {passed} PASS / 0 FAIL / {skipped} SKIP "
                f"(total {result.testsRun}); real LA/NAS/ULIYA NOT_RUN when skipped")
          PY
      - name: Preserve canonical original and approval boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          skill=Path("skill/flowpilot-nas/SKILL.md").read_bytes()
          assert hashlib.sha256(skill).hexdigest()=="47d119123387ec46133a62fdec58ef42ca3852491b132d32798951a6430c233b"
          print("Canonical G49 Skill preserved; public artifacts/adoption NOT_CHANGED")
          print("UGREEN registered Expert and NAS NOT_RUN, Devpost NOT_SUBMITTED")
          PY

  windows-local-regression:
    name: Windows Python 3.11 local-only full regression
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: G90-G92 focused Windows master and synthetic SQLite regression
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_master_progress.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_flowpilot_la_synthetic_import.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python render_master_progress.py --check
          exit $LASTEXITCODE
      - name: Full Windows PowerShell 5.1 owner-equivalent offline verification
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\verify_local.ps1 -Mode full
          exit $LASTEXITCODE
