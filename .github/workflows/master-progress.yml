name: Check 24-day master progress
on:
  push:
    branches: ["lead/ugreen"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate 24-day JSON and generated dashboard
        run: python render_master_progress.py --check
